<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Velo Recorder</title>
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <script>
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('velo-settings-v2')).theme || 'light'; } catch (_) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M3 5h7l6 14 6-14h7L16 29z"/></svg>
        <div class="brand-text"><div class="brand-name">VELO</div><div class="brand-sub">Recorder</div></div>
      </div>
      <nav class="nav" id="nav" aria-label="Main">
        <button class="nav-item" data-route="record" data-icon="video" data-label="Record"></button>
        <button class="nav-item" data-route="library" data-icon="library" data-label="Library" id="nav-library"></button>
        <button class="nav-item" data-route="editor" data-icon="clapperboard" data-label="Editor"></button>
        <span class="nav-spacer"></span>
        <button class="nav-item" data-route="settings" data-icon="settings" data-label="Settings"></button>
      </nav>
      <div class="save-to">
        <small>SAVING TO</small>
        <button data-act="reveal-folder" aria-label="Open save folder"><span data-icon="folder-open"></span><span id="save-path"></span></button>
      </div>
    </aside>

    <div class="main">
      <header class="titlebar" data-tauri-drag-region>
        <h2 id="page-name"></h2>
        <div class="tools">
          <span id="rec-pill"></span>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"></button>
          <span class="divider"></span>
          <button class="icon-btn win" aria-label="Minimize" data-win="minimize"><span data-icon="minus"></span></button>
          <button class="icon-btn win" aria-label="Maximize" data-win="toggleMaximize"><span data-icon="copy"></span></button>
          <button class="icon-btn win close" aria-label="Close" data-win="close"><span data-icon="x"></span></button>
        </div>
      </header>
      <main class="content"><div class="page" id="page"></div></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
